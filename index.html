<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulado – Guia Por Dentro da B3</title>
<meta name="description" content="Simulado PQO Compliance no formato da prova oficial, com consulta ao Guia Por Dentro da B3.">
<meta name="theme-color" content="#0b2f6b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Simulado B3">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main>
<button type="button" id="themeToggle" class="theme-top-btn" aria-label="Alternar tema claro/escuro" title="Alternar tema">🌙</button>
<header class="apphead"><h2>Simulado – Certificação PQO</h2></header>
<div id="setup" class="setup hide"></div>
<div id="quiz" class="hide">
<p class="sub" id="sub"></p><div class="pbar"><i id="pfill"></i></div>
<div id="res" class="hide"></div>
<div id="qs"></div>
</div>
</main>

<div class="bar hide" id="bar">
<div class="qnav-legend"><span><i class="lg-ok"></i><b id="legendOk">0 Acertos</b></span><span><i class="lg-bad"></i><b id="legendBad">0 Erros</b></span><span><i></i><b id="legendMiss">0 Faltantes</b></span></div>
<div class="qnav-wrap"><div class="qnav" id="qnav"></div></div>
<span class="bt"><button type="button" id="cnt" class="alt mob">0/0</button><button type="button" id="prev" class="alt mob" aria-label="Anterior">‹</button><button type="button" id="next" class="alt mob" aria-label="Próxima">›</button><button id="home" class="alt">Início</button><button id="send">Enviar respostas</button><button id="errs" class="alt hide">Refazer só os erros</button><button id="again" class="hide">Novo simulado</button></span>
</div>

<div class="pmodal hide" id="pmodal" role="dialog" aria-modal="true" aria-label="Consulta ao Guia Por Dentro da B3">
<div class="pm-box">
<div class="pm-bar">
<span class="pm-title">📖 Guia Por Dentro da B3 · <span id="pmLbl">p. 1</span></span>
<div class="pm-ctrl"><button type="button" class="alt" id="pmPrev" title="Página anterior">‹ Anterior</button><input type="number" id="pmInp" min="1" max="715" inputmode="numeric" aria-label="Ir para a página (número do rodapé)" title="Número da página impresso no rodapé do guia"><button type="button" class="alt" id="pmNext" title="Próxima página">Próxima ›</button><button type="button" class="alt" id="pmZoom" title="Alternar zoom">🔍 Zoom</button><button type="button" id="pmClose" title="Fechar (Esc)">✕ Fechar</button></div>
</div>
<div class="pm-body" id="pmBody"><span class="pm-status" id="pmStat">Carregando página...</span><img id="pmImg" alt="Página do Guia Por Dentro da B3" draggable="false"></div>
<div class="pm-hint">Deslize para os lados para trocar de página · toque na página para ampliar</div>
</div>
</div>

<script src="js/questions.js"></script>
<script src="js/pagemap.js"></script>
<script src="js/app.js"></script>
<script src="js/mobile.js"></script>
<script>if("serviceWorker"in navigator&&location.protocol.indexOf("http")===0){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
</body>
</html>
